server:
  port: 8080

spring:
  application:
    name: microservice-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: patient-service
              uri: http://localhost:8081
              predicates:
                - Path=/patients/**
            - id: note-service
              uri: http://localhost:8083
              predicates:
                - Path=/notes/**
            - id: risque-service
              uri: http://localhost:8084
              predicates:
                - Path=/assess/**