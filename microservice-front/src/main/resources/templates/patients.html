<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Patients - Médilabo</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 2rem;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #ccc;
            padding: .5rem .75rem;
            text-align: left;
        }
        th {
            background: #f4f4f4;
        }
    </style>
</head>
<body>
    <h1>Patients</h1>
        <table>
            <thead>
                <tr><th>Prénom</th><th>Nom</th><th>Date de naissance</th><th>Genre</th><th></th></tr>
            </thead>
            <tbody>
                <tr th:each="patient : ${patients}">
                    <td th:text="${patient.firstName}"></td>
                    <td th:text="${patient.lastName}"></td>
                    <td th:text="${patient.dateOfBirth}"></td>
                    <td th:text="${patient.gender}"></td>
                    <td><a th:href="@{/patients/{id}(id=${patient.id})}">Voir</a></td>
                </tr>
            </tbody>
        </table>
</body>
</html>
