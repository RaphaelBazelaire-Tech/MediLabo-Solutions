<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="utf-8">
    <title>Dossier patient - Médilabo</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 2rem;
        }
        p {
            margin: 4rem 0;
        }
    </style>
</head>
<body>
    <h1>Dossier patient</h1>
    <p><strong>Prénom :</strong> <span th:text="${patient.firstName}"></span></p>
    <p><strong>Nom :</strong> <span th:text="${patient.lastName}"></span></p>
    <p><strong>Date de naissance :</strong> <span th:text="${patient.dateOfBirth}"></span></p>
    <p><strong>Genre :</strong> <span th:text="${patient.gender}"></span></p>
    <p><strong>Adresse :</strong> <span th:text="${patient.address}"></span></p>
    <p><strong>Téléphone :</strong> <span th:text="${patient.phone}"></span></p>
    <a th:href="@{/patients}">← Retour à la liste</a>
</body>
</html>
